{% extends 'biblioteca_app/base.html' %}

{% block title %}Agregar Libro - Biblioteca{% endblock %}

{% block content %}
    <h1 class="page-title"><i class="bi bi-plus-circle-fill"></i> Agregar Libro</h1>
    
    {% if mensaje %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i> {{ mensaje }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endif %}
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="isbn" class="form-label">ISBN:</label>
                    <input type="text" class="form-control" id="isbn" name="isbn" required placeholder="Ingrese el ISBN">
                </div>
                
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título:</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" required placeholder="Ingrese el título del libro">
                </div>
                
                <div class="mb-3">
                    <label for="autor" class="form-label">Autor:</label>
                    <input type="text" class="form-control" id="autor" name="autor" required placeholder="Ingrese el autor del libro">
                </div>
                
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-save"></i> Agregar Libro
                </button>
            </form>
        </div>
    </div>
    
    <div class="mt-3">
        <a href="{% url 'index' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>
{% endblock %}
