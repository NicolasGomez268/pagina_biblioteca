<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca Edna - UI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Biblioteca Edna</a>
        <a class="btn btn-outline-light" href="/" target="_blank">API JSON</a>
      </div>
    </nav>

    <main class="container my-4">
      <div class="row g-4">
        <div class="col-12">
          <div class="alert alert-info" role="alert">
            <strong>Bienvenida/o</strong> — Esta es una UI mínima para
            interactuar con la API.
          </div>
        </div>

        <!-- Alta de socio -->
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header">Alta de Socio</div>
            <div class="card-body">
              <form id="form-alta-socio" class="row g-2">
                <div class="col-6">
                  <input
                    class="form-control"
                    name="nombre"
                    placeholder="Nombre"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="apellido"
                    placeholder="Apellido"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="dni"
                    placeholder="DNI"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="email"
                    placeholder="Email"
                    type="email"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="telefono"
                    placeholder="Teléfono"
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="direccion"
                    placeholder="Dirección"
                  />
                </div>
                <div class="col-12 d-grid">
                  <button class="btn btn-primary" type="submit">
                    Crear Socio
                  </button>
                </div>
              </form>
              <div id="resultado-alta" class="mt-2 small"></div>
            </div>
          </div>
        </div>

        <!-- Libros disponibles y préstamo -->
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header">Libros y Préstamos</div>
            <div class="card-body">
              <div class="d-flex gap-2 align-items-end">
                <div class="flex-fill">
                  <label class="form-label">Libros</label>
                  <select id="select-libros" class="form-select"></select>
                </div>
                <div>
                  <button
                    id="btn-refrescar-libros"
                    class="btn btn-outline-secondary"
                  >
                    Refrescar
                  </button>
                </div>
              </div>
              <hr />
              <form id="form-prestamo" class="row g-2">
                <div class="col-6">
                  <input
                    class="form-control"
                    name="socioId"
                    placeholder="ID Socio"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="diasPrestamo"
                    placeholder="Días (opcional)"
                    type="number"
                    min="1"
                  />
                </div>
                <div class="col-12 d-grid">
                  <button class="btn btn-success" type="submit">
                    Crear Préstamo
                  </button>
                </div>
              </form>
              <div id="resultado-prestamo" class="mt-2 small"></div>
            </div>
          </div>
        </div>

        <!-- Devolución -->
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header">Devolución</div>
            <div class="card-body">
              <form id="form-devolucion" class="row g-2">
                <div class="col-6">
                  <input
                    class="form-control"
                    name="prestamoId"
                    placeholder="ID Préstamo"
                    required
                  />
                </div>
                <div class="col-6">
                  <select class="form-select" name="estadoLibro">
                    <option value="bueno">Bueno</option>
                    <option value="dañado">Dañado</option>
                    <option value="perdido">Perdido</option>
                  </select>
                </div>
                <div class="col-12">
                  <input
                    class="form-control"
                    name="observaciones"
                    placeholder="Observaciones (opcional)"
                  />
                </div>
                <div class="col-12 d-grid">
                  <button class="btn btn-warning" type="submit">
                    Registrar Devolución
                  </button>
                </div>
              </form>
              <div id="resultado-devolucion" class="mt-2 small"></div>
            </div>
          </div>
        </div>

        <!-- Multas -->
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header">Multas</div>
            <div class="card-body">
              <form id="form-multa" class="row g-2">
                <div class="col-6">
                  <input
                    class="form-control"
                    name="socioId"
                    placeholder="ID Socio"
                    required
                  />
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="prestamoId"
                    placeholder="ID Préstamo"
                    required
                  />
                </div>
                <div class="col-6">
                  <select class="form-select" name="tipo">
                    <option value="retraso">Retraso</option>
                    <option value="dano">Daño</option>
                    <option value="perdida">Pérdida</option>
                  </select>
                </div>
                <div class="col-6">
                  <input
                    class="form-control"
                    name="monto"
                    type="number"
                    placeholder="Monto"
                    required
                    min="1"
                  />
                </div>
                <div class="col-12">
                  <input
                    class="form-control"
                    name="descripcion"
                    placeholder="Descripción (opcional)"
                  />
                </div>
                <div class="col-12 d-grid">
                  <button class="btn btn-danger" type="submit">
                    Registrar Multa
                  </button>
                </div>
              </form>
              <div id="resultado-multa" class="mt-2 small"></div>
            </div>
          </div>
        </div>

        <!-- Listados -->
        <div class="col-12">
          <div class="card shadow-sm">
            <div class="card-header">Listados</div>
            <div class="card-body">
              <div class="d-flex gap-2 mb-2">
                <button
                  id="btn-listar-socios"
                  class="btn btn-outline-primary btn-sm"
                >
                  Socios
                </button>
                <button
                  id="btn-listar-prestamos"
                  class="btn btn-outline-primary btn-sm"
                >
                  Préstamos
                </button>
                <button
                  id="btn-listar-multas"
                  class="btn btn-outline-primary btn-sm"
                >
                  Multas
                </button>
              </div>
              <pre
                id="listado"
                class="bg-dark text-light p-3 rounded"
                style="max-height: 300px; overflow: auto"
              ></pre>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
